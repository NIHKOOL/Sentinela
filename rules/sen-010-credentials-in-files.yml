title: Password search in files            # required: shown in alerts
id: SEN-010                                # required to raise alerts
status: experimental
description: A command searched file contents for passwords or secrets. Attackers do this to find credentials left in config files and scripts.
author: NIHKOOL
date: 2026-10-21
tags:
  - attack.credential_access               # MITRE tactic
  - attack.t1552.001                       # Unsecured Credentials: Credentials In Files
logsource:
  category: process_creation               # which events to look at
detection:
  search_programs:
    process_file:                          # file name only, lowercase (Linux has no .exe)
      - grep
      - egrep
      - fgrep
      - zgrep
      - rg
  secret_words:
    command_line|contains:
      - password
      - secret
  condition: search_programs and secret_words
falsepositives:                            # shown to the SOC analyst
  - Administrators checking config files for a password setting
  - User searching files that mention "password" but hold no real password(docs, source code).
level: medium                              # informational, low, medium, high, critical
details: "'{user}' searched files for secrets on {hostname}: {command_line}"
