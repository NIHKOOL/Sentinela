title: Known credential theft tool
id: SEN-005
status: stable
description: A process name matches a known password-stealing tool.
author: Sentinela
date: 2026-10-06
tags:
  - attack.credential_access
  - attack.t1003   # OS Credential Dumping
logsource:
  category: process_creation
detection:
  selection:
    process_file:
      - mimikatz.exe
      - credential_dumper.exe   # the simulator's stand-in tool
      - credential_dumper
  condition: selection
falsepositives:
  - Authorized penetration testers (check with the security team)
level: critical
details: "Credential theft tool '{process_file}' was run by '{user}' on {hostname}."
